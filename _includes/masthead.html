<header class="masthead"><div class="masthead__inner-wrap"><a class="site-brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}><span class="brand-mark" aria-hidden="true">L/T</span><span>Leo Tsou</span></a><nav class="site-nav" id="site-nav" aria-label="主要導覽">{% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}</nav></div></header>
