<div class="notes-list">
{% for post in site.posts limit:include.limit %}<a class="note-row" href="{{ post.url | relative_url }}"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time><div><h3>{{ post.title }}</h3><p>{{ post.excerpt | strip_html }}</p></div><span class="note-link-label" aria-hidden="true">↗</span></a>{% else %}<p class="empty-note">筆記還在整理中。你可以先看看<a href="{{ '/projects/' | relative_url }}">目前的專案</a>。</p>{% endfor %}
</div>
